name: Update NetEase releases

on:
  workflow_dispatch:
    inputs:
      date:
        description: "抓取日期，留空则抓取今天（北京时间）"
        required: false
        default: ""
        type: string
      rescan_days:
        description: "抓取几天，默认 2 天"
        required: false
        default: "2"
        type: string

  schedule:
    # 北京时间 00:00–01:00 密集扫描
    - cron: "0 16 * * *"
    - cron: "5 16 * * *"
    - cron: "10 16 * * *"
    - cron: "15 16 * * *"
    - cron: "20 16 * * *"
    - cron: "30 16 * * *"
    - cron: "45 16 * * *"
    - cron: "0 17 * * *"

    # 白天周期扫描
    - cron: "10 18 * * *"
    - cron: "10 0 * * *"
    - cron: "10 6 * * *"
    - cron: "10 12 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Fetch NetEase releases
        env:
          TARGET_DATE: ${{ inputs.date }}
          RESCAN_DAYS: ${{ inputs.rescan_days || '2' }}
        run: |
          if [ -n "$TARGET_DATE" ]; then
            python scripts/fetch_netease.py \
              --date "$TARGET_DATE" \
              --rescan-days "$RESCAN_DAYS"
          else
            python scripts/fetch_netease.py \
              --rescan-days "$RESCAN_DAYS"
          fi

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/*.json

          if git diff --cached --quiet; then
            echo "No data changes."
            exit 0
          fi

          git commit -m "Update NetEase release data"
          git push
