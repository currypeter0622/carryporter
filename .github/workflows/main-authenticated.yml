name: Update NetEase releases

on:
  workflow_dispatch:
    inputs:
      date:
        description: "抓取日期，留空则抓取今天（北京时间）"
        required: false
        default: ""
        type: string

      rescan_days:
        description: "连续扫描几天，默认 2 天"
        required: false
        default: "2"
        type: string

  schedule:
    # GitHub Actions 使用 UTC
    # 北京时间 00:08 = UTC 16:08（前一天）
    - cron: "8 16 * * *"

    # 北京时间 04:00 = UTC 20:00（前一天）
    - cron: "0 20 * * *"

    # 北京时间 19:00 = UTC 11:00
    - cron: "0 11 * * *"

permissions:
  contents: write

concurrency:
  group: netease-auto-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Start NetEase API
        shell: bash
        run: |
          set -euo pipefail

          nohup npx -y NeteaseCloudMusicApi@4.32.0 \
            > /tmp/netease-api.log 2>&1 &

          for i in {1..90}; do
            if curl -fsS http://127.0.0.1:3000/ >/dev/null 2>&1; then
              echo "NetEase API is ready."
              break
            fi

            if [ "$i" -eq 90 ]; then
              echo "NetEase API failed to start."
              tail -200 /tmp/netease-api.log || true
              exit 1
            fi

            sleep 1
          done

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail

          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Fetch authenticated full releases
        env:
          NETEASE_API_BASE: http://127.0.0.1:3000
          NETEASE_MUSIC_U: ${{ secrets.NETEASE_MUSIC_U }}

          NETEASE_SCAN_THREADS: "4"
          NETEASE_PAGE_SIZE: "30"
          NETEASE_MAX_PAGES: "500"

          NETEASE_RECENT_LIMIT: "50"
          NETEASE_NEW_ALBUM_PROBE_LIMIT: "20"
          NETEASE_OWNED_VERIFY_LIMIT: "50"

        shell: bash
        run: |
          set -euo pipefail

          if [ -n "${{ inputs.date }}" ]; then
            python -u scripts/fetch_netease.py \
              --date "${{ inputs.date }}" \
              --rescan-days "${{ inputs.rescan_days || '2' }}" \
              --full \
              --va-rescue
          else
            python -u scripts/fetch_netease.py \
              --rescan-days "${{ inputs.rescan_days || '2' }}" \
              --full \
              --va-rescue
          fi

      - name: Commit updated data
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            data/*.json \
            data/album_cache.json \
            data/artist_cache_*.json

          if git diff --cached --quiet; then
            echo "No data changes."
            exit 0
          fi

          git commit -m "Update NetEase release data"
          git push

      - name: API diagnostics on failure
        if: failure()
        shell: bash
        run: |
          echo "========== NetEase API log =========="
          tail -300 /tmp/netease-api.log || true
