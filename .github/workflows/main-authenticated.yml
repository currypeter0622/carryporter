name: Update NetEase releases

on:
  workflow_dispatch:
    inputs:
      date:
        description: "抓取日期，留空则抓取今天（北京时间）"
        required: false
        default: ""
        type: string
      rescan_days:
        description: "抓取几天，默认 2 天"
        required: false
        default: "2"
        type: string

  schedule:
    - cron: "10 0 * * *"
    - cron: "10 6 * * *"
    - cron: "10 12 * * *"
    - cron: "10 18 * * *"

permissions:
  contents: write

concurrency:
  group: netease-auto-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Start NetEase API
        shell: bash
        run: |
          nohup npx -y NeteaseCloudMusicApi@4.32.0 > /tmp/netease-api.log 2>&1 &
          for i in {1..90}; do
            if curl -fsS http://127.0.0.1:3000/ >/dev/null 2>&1; then exit 0; fi
            sleep 1
          done
          cat /tmp/netease-api.log || true
          exit 1

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Fetch authenticated global releases
        env:
          NETEASE_API_BASE: http://127.0.0.1:3000
          NETEASE_MUSIC_U: ${{ secrets.NETEASE_MUSIC_U }}
          NETEASE_SCAN_THREADS: "4"
          NETEASE_PAGE_SIZE: "30"
          NETEASE_MAX_PAGES: "500"
        shell: bash
        run: |
          if [ -n "${{ inputs.date }}" ]; then
            python scripts/fetch_netease.py --date "${{ inputs.date }}" --rescan-days "${{ inputs.rescan_days || '2' }}" --va-rescue
          else
            python scripts/fetch_netease.py --rescan-days "${{ inputs.rescan_days || '2' }}" --va-rescue
          fi

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/*.json data/album_cache.json data/artist_cache_*.json
          if git diff --cached --quiet; then echo "No data changes."; exit 0; fi
          git commit -m "Update NetEase release data"
          git push
