name: Full NetEase release scan

on:
  workflow_dispatch:
    inputs:
      date:
        description: "扫描日期；留空则使用北京时间今天"
        required: false
        default: ""
        type: string
      rescan_days:
        description: "连续扫描几天，默认 7"
        required: false
        default: "7"
        type: string
      deep_scan:
        description: "启用参考算法 Candidate Pool + V.A. 兜底"
        required: false
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: full-netease-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Start NetEase API
        shell: bash
        run: |
          nohup npx -y NeteaseCloudMusicApi@4.32.0 > /tmp/netease-api.log 2>&1 &
          for i in {1..90}; do
            if curl -fsS http://127.0.0.1:3000/ >/dev/null 2>&1; then
              echo "NetEase API is ready."
              break
            fi
            if [ "$i" -eq 90 ]; then
              echo "NetEase API failed to start."
              tail -200 /tmp/netease-api.log || true
              exit 1
            fi
            sleep 1
          done

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify MUSIC_U secret exists
        env:
          NETEASE_MUSIC_U: ${{ secrets.NETEASE_MUSIC_U }}
        run: |
          if [ -z "$NETEASE_MUSIC_U" ]; then
            echo "缺少仓库 Secret：NETEASE_MUSIC_U"
            echo "请在 Settings -> Secrets and variables -> Actions 中添加。"
            exit 1
          fi

      - name: Run full scanner
        env:
          NETEASE_API_BASE: http://127.0.0.1:3000
          NETEASE_MUSIC_U: ${{ secrets.NETEASE_MUSIC_U }}
          NETEASE_SCAN_THREADS: "4"
          NETEASE_PAGE_SIZE: "30"
          NETEASE_MAX_PAGES: "500"
          NETEASE_RECENT_LIMIT: "50"
          NETEASE_NEW_ALBUM_PROBE_LIMIT: "20"
          NETEASE_OWNED_VERIFY_LIMIT: "50"
        shell: bash
        run: |
          if [ "${{ inputs.deep_scan }}" = "false" ]; then
            FULL_ARG=""
            VA_ARG="--va-rescue"
          else
            FULL_ARG="--full"
            VA_ARG="--va-rescue"
          fi

          if [ -n "${{ inputs.date }}" ]; then
            python scripts/fetch_netease.py \
              --date "${{ inputs.date }}" \
              --rescan-days "${{ inputs.rescan_days || '2' }}" \
              $FULL_ARG $VA_ARG
          else
            python scripts/fetch_netease.py \
              --rescan-days "${{ inputs.rescan_days || '2' }}" \
              $FULL_ARG $VA_ARG
          fi

      - name: Commit updated data
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/*.json data/album_cache.json data/artist_cache_*.json

          if git diff --cached --quiet; then
            echo "No data changes."
            exit 0
          fi

          git commit -m "Run full NetEase release scan"
          git push

      - name: API diagnostics on failure
        if: failure()
        run: |
          echo "========== NetEase API log =========="
          tail -300 /tmp/netease-api.log || true
